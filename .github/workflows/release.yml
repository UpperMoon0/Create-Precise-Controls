name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish the current main-branch version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: create-precise-controls-release
  cancel-in-progress: false

jobs:
  version-change:
    name: Check release trigger
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect publishable version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail

          read_version() {
            sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' \
              | head -n1 | tr -d '\r' | xargs
          }

          current="$(read_version < gradle.properties)"
          [[ "$current" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] \
            || { echo "Invalid mod_version: $current" >&2; exit 1; }
          echo "value=$current" >> "$GITHUB_OUTPUT"

          if [[ "$current" == *-SNAPSHOT ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Development version $current is not publishable."
            exit 0
          fi

          changed=false
          tag="v${current}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF" == "refs/heads/main" && "$MANUAL_RELEASE" == "true" ]]; then
              changed=true
              echo "Manual release requested for $current."
            else
              echo "Manual publishing requires the main branch and release=true."
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "Cannot resolve previous push commit ${BEFORE_SHA:-<empty>}; refusing to infer a release." >&2
              exit 1
            fi

            previous="$(git show "${BEFORE_SHA}:gradle.properties" | read_version)"
            echo "mod_version: ${previous} -> ${current}"
            if [[ "$current" != "$previous" ]]; then
              changed=true
              echo "Version bump detected."
            elif ! git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              changed=true
              echo "Current version $current has no $tag tag; recovering the unpublished release."
            else
              echo "Version is unchanged and $tag already exists; nothing to publish."
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.loader_name }} ${{ matrix.minecraft }}
    needs: version-change
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: forge-1.20.1
            platform: forge
            loader_name: Forge
            minecraft: '1.20.1'
            java: '17'
          - project: neoforge-1.21.1
            platform: neoforge
            loader_name: NeoForge
            minecraft: '1.21.1'
            java: '21'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release inputs
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.version-change.outputs.value }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          [[ "$version" == "$EXPECTED_VERSION" ]] \
            || { echo "Release version changed between gate and build." >&2; exit 1; }
          [[ "$version" != *-SNAPSHOT ]] \
            || { echo "Refusing to publish SNAPSHOT version $version." >&2; exit 1; }
          test -s "changelog/$version.md" \
            || { echo "Missing release changelog: changelog/$version.md" >&2; exit 1; }

      - name: Test and build ${{ matrix.loader_name }} ${{ matrix.minecraft }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :common:test :${{ matrix.project }}:build --no-daemon --no-configuration-cache

      - name: Verify release JAR
        shell: bash
        env:
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
          PROJECT: ${{ matrix.project }}
          PLATFORM: ${{ matrix.platform }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          jar_path="${PROJECT}/build/libs/create-precise-controls-${PLATFORM}-${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
          [[ -f "$jar_path" ]] \
            || { echo "Expected release JAR was not produced: $jar_path" >&2; exit 1; }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: create-precise-controls-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ needs.version-change.outputs.value }}
          path: ${{ matrix.project }}/build/libs/create-precise-controls-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ needs.version-change.outputs.value }}.jar
          if-no-files-found: error

  publish-curseforge:
    name: Publish ${{ matrix.loader_name }} ${{ matrix.minecraft }} to CurseForge
    needs: [version-change, build]
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge
            loader_name: Forge
            minecraft: '1.20.1'
            java_version_name: Java 17
          - platform: neoforge
            loader_name: NeoForge
            minecraft: '1.21.1'
            java_version_name: Java 21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: create-precise-controls-${{ matrix.platform }}-${{ matrix.minecraft }}-${{ needs.version-change.outputs.value }}
          path: curseforge-artifact

      - name: Select release JAR
        id: release_file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find curseforge-artifact -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          echo "jar_path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge project 1696007
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1696007'
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
          CHANGELOG_PATH: changelog/${{ needs.version-change.outputs.value }}.md
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          LOADER_NAME: ${{ matrix.loader_name }}
          JAVA_VERSION_NAME: ${{ matrix.java_version_name }}
        run: |
          set -euo pipefail

          [[ "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]] \
            || { echo "Invalid CurseForge project ID: $CURSEFORGE_PROJECT_ID" >&2; exit 1; }
          [[ -n "${CURSEFORGE_API_TOKEN:-}" ]] \
            || { echo 'Missing required GitHub secret: CURSEFORGE_API_TOKEN' >&2; exit 1; }
          [[ -f "$CHANGELOG_PATH" ]] \
            || { echo "Missing release changelog: $CHANGELOG_PATH" >&2; exit 1; }
          [[ -f "$JAR_PATH" ]] \
            || { echo "Missing release JAR: $JAR_PATH" >&2; exit 1; }

          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER_NAME" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --retry 4 --retry-max-time 90 --connect-timeout 15 --max-time 45 \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            https://minecraft.curseforge.com/api/game/versions)"

          while IFS= read -r version_name; do
            jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" >/dev/null \
              || { echo "CurseForge does not recognize game version tag: $version_name" >&2; exit 1; }
          done < <(jq -r '.[]' <<< "$game_version_names")

          relations='{"projects":[{"slug":"create","type":"requiredDependency"}]}'
          metadata="$(jq -cn \
            --rawfile changelog "$CHANGELOG_PATH" \
            --arg displayName "Create: Precise Controls ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$game_version_names" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --retry 4 --retry-max-time 90 --connect-timeout 15 --max-time 45 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"

          if [[ "$http_status" =~ ^2 ]]; then
            echo "Published ${JAR_PATH} to CurseForge project ${CURSEFORGE_PROJECT_ID} as file $(jq -er '.id' <<< "$response")."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has ${JAR_PATH}; treating this retry as successful."
          else
            echo "CurseForge upload failed with HTTP $http_status: $response" >&2
            exit 1
          fi

  publish-github-release:
    name: Publish GitHub Release
    needs: [version-change, build]
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Verify tag and release artifacts
        shell: bash
        env:
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
        run: |
          set -euo pipefail
          tag="v${MOD_VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            [[ "$tagged_commit" == "$GITHUB_SHA" ]] \
              || { echo "Tag $tag already points to $tagged_commit. Bump mod_version before releasing another commit." >&2; exit 1; }
          fi

          mapfile -t jars < <(find release-artifacts -type f -name '*.jar' | sort)
          [[ ${#jars[@]} -eq 2 ]] \
            || { echo "Expected exactly two release JARs, found ${#jars[@]}" >&2; printf '  %s\n' "${jars[@]}" >&2; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-change.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: "Create: Precise Controls v${{ needs.version-change.outputs.value }}"
          body_path: changelog/${{ needs.version-change.outputs.value }}.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-artifacts/**/*.jar
