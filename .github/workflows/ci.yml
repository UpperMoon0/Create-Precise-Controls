name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.20.1
            java: '17'
            task: ':forge-1.20.1:build'
          - name: NeoForge 1.21.1
            java: '21'
            task: ':neoforge-1.21.1:build'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify target
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :common:test '${{ matrix.task }}' --no-daemon --no-configuration-cache
