plugins {
    id 'idea'
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every supported Create: Precise Controls module.'
    dependsOn ':forge-1.20.1:build'
    dependsOn ':neoforge-1.21.1:build'
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs shared logic tests and loader-module tests.'
    dependsOn ':common:test'
    dependsOn ':forge-1.20.1:test'
    dependsOn ':neoforge-1.21.1:test'
}
