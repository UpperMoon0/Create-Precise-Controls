plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = "create-precise-controls-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('shared/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('shared/src/main/resources')

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "com.simibubi.create:create-1.21.1:${create_version}"
    localRuntime "com.simibubi.create:create-1.21.1:${create_version}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors,
            mod_description: mod_description, mod_url: mod_url,
            mod_issues_url: mod_issues_url, loader_version_range: loader_version_range,
            neo_version: neo_version, minecraft_version_range: minecraft_version_range
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
